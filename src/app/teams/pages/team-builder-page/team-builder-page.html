<section class="team-builder">
  <div class="page-header">
    <h1>Team Builder</h1>

    <button
      matButton="filled"
      type="button"
      (click)="openCreateTeamDialog()"
    >
      <mat-icon>add</mat-icon>
      Create Team
    </button>
  </div>

  @if (loading()) {
    <div class="state">
      <mat-spinner diameter="48"/>
      <p>Loading teams...</p>
    </div>
  } @else if (error()) {
    <div class="state">
      <p>{{ error() }}</p>

      <button
        matButton="filled"
        type="button"
        (click)="retry()"
      >
        Retry
      </button>
    </div>
  } @else if (isEmpty()) {
    <div class="state">
      <p>No teams found.</p>
    </div>
  } @else if (pokemonError()) {
    <div class="state">
      <p>{{ pokemonError() }}</p>

      <button
        matButton="filled"
        type="button"
        (click)="retryPokemon()"
      >
        Retry
      </button>
    </div>
  } @else {
    <div class="team-list">
      <div class="team-list">
        @for (team of teams(); track team.id) {
          <app-team-card
            [team]="team"
            [pokemon]="getTeamPokemon(team.pokemonIds)"
            [selected]="selectedTeamId() === team.id"
            [loading]="pokemonLoading()"
            (selectTeam)="selectTeam($event)"
            (deleteTeam)="deleteTeam($event)"
          />
        }
      </div>
    </div>
  }
</section>
