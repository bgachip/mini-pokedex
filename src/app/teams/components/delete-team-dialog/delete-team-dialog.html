<h2 mat-dialog-title>Delete team?</h2>

<mat-dialog-content>
  <p>
    Are you sure you want to delete
    <strong>{{ data.teamName }}</strong>?
  </p>

  <p class="warning">
    This action cannot be undone.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    matButton
    type="button"
    (click)="cancel()"
  >
    <mat-icon>close</mat-icon>
    Cancel
  </button>

  <button
    matButton="filled"
    type="button"
    class="delete-button"
    (click)="confirm()"
  >
    <mat-icon>delete</mat-icon>
    Delete
  </button>
</mat-dialog-actions>
